<!DOCTYPE html>
 <html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-vZf1lgWeoIeGgh/OfkvDS0OOhIvOD7zqNgIXjxUuf1M='; style-src 'sha256-oWRpM7UEph6FEZwBDbePYHyPzkVPRDiXpBhO1dufQb0='; frame-src https://script.google.com https://*.googleusercontent.com; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
<title>한솔어린이보육재단 고충처리시스템</title>
<style>html, body { margin: 0; height: 100%; background: #f8fafc; }
iframe { display: block; width: 100%; height: 100%; border: 0; }
p { font-family: -apple-system, "Malgun Gothic", sans-serif; text-align: center; padding: 48px 16px; color: #334155; line-height: 1.7; }</style>
</head>
<body>
<noscript><p>이 시스템은 자바스크립트가 필요합니다. 브라우저 설정에서 자바스크립트를 켜 주세요.</p></noscript>
<p id="msg" hidden></p>
<iframe id="app" data-src="https://script.google.com/macros/s/AKfycbwcIMGgII9tDOZtmn4E3QmBxE9ID9JxuAjRN6-7IKG9VddwpEw6sdf23kAR1bSLjajI1g/exec" title="한솔어린이보육재단 고충처리시스템" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals" allow="clipboard-write" referrerpolicy="no-referrer"></iframe>
<script>(function () {
var f = document.getElementById('app');
var msg = document.getElementById('msg');
var url = f.getAttribute('data-src') || '';
function show(text) { f.parentNode.removeChild(f); msg.textContent = text; msg.hidden = false; }
if (window.top !== window.self) {
show('보안을 위해 다른 사이트 안에서는 열 수 없습니다. 재단이 안내한 주소로 직접 접속해 주세요.');
try { window.top.location.replace(window.self.location.href); } catch (e) {}
return;
}
if (!/^https:\/\/script\.google\.com\/(a\/[^\/]+\/)?macros\/s\/[A-Za-z0-9_-]{20,}\/exec$/.test(url)) {
show('웹앱 주소가 설정되지 않았거나 올바르지 않습니다. 관리자에게 문의해 주세요.');
return;
}
f.src = url;
})();</script>
</body>
</html>
