<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
 
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-5All/h6D4Vqla07I69WgjCx2dX7Zx5ODXOefvtUu/4U='; style-src 'sha256-BAeeoZOEMF0S+oyo6n7b2XxXtI0JlL7e9AXfTzbnRys='; frame-src https://script.google.com https://*.googleusercontent.com; img-src 'self'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
  <title>한솔어린이보육재단 고충처리시스템</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f8fafc; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    p { font-family: sans-serif; text-align: center; padding: 40px 16px; color: #334155; line-height: 1.6; }
  </style>
</head>
<body>
  <noscript><p> 브라우저 설정에서 자바스크립트를 켜 주세요.</p></noscript>
  <p id="framed" hidden>보안을 위해 다른 사이트 안에서는 열 수 없습니다.<br> </p>

 
  <iframe id="app"
          data-src="https://script.google.com/macros/s/AKfycbwcIMGgII9tDOZtmn4E3QmBxE9ID9JxuAjRN6-7IKG9VddwpEw6sdf23kAR1bSLjajI1g/exec"
          title="한솔어린이보육재단 고충처리시스템"
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals"
          allow="clipboard-write"
          referrerpolicy="no-referrer"></iframe>

  <script>
    (function () {
      var f = document.getElementById('app');
      if (window.top !== window.self) {
 
        f.parentNode.removeChild(f);
        document.getElementById('framed').hidden = false;
        try { window.top.location.replace(window.self.location.href); } catch (e) { /* 브라우저가 막으면 안내문만 표시 */ }
        return;
      }
      f.src = f.getAttribute('data-src');
    })();
  </script>
</body>
</html>
